<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF1EE" />
      <stop offset="100%" stop-color="#E3E8E2" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E6B57" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0E6B57" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8441C" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#B8441C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)" />
  <circle cx="180" cy="70" r="220" fill="url(#glow1)" />
  <circle cx="1040" cy="220" r="200" fill="url(#glow2)" />

  <!-- faint ledger rule lines -->
  <g stroke="#1A2420" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="130" x2="1200" y2="130" />
    <line x1="0" y1="170" x2="1200" y2="170" />
  </g>

  <!-- quote-mark logomark, echoing LogoMark.tsx -->
  <g transform="translate(80,100)">
    <path d="M0 20 Q0 0 20 0 L20 8 Q10 8 10 18 L18 18 L18 34 L0 34 Z" fill="#0E6B57" />
    <path d="M24 20 Q24 0 44 0 L44 8 Q34 8 34 18 L42 18 L42 34 L24 34 Z" fill="#B8441C" />
  </g>

  <!-- title -->
  <text x="150" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#1A2420" font-weight="600">
    Agentic RAG Assistant
  </text>
  <text x="151" y="172" font-family="'Courier New', monospace" font-size="15" letter-spacing="3" fill="#5C6B62">
    HYBRID RETRIEVAL · RERANKING · SELF-VERIFICATION · CITED ANSWERS
  </text>

  <!-- citation stamp motifs -->
  <g font-family="'Courier New', monospace" font-size="13" font-weight="700">
    <g transform="translate(910,60) rotate(-8)">
      <rect x="-16" y="-14" width="32" height="26" rx="3" fill="#B8441C" fill-opacity="0.10" stroke="#B8441C" stroke-opacity="0.5" />
      <text x="0" y="5" text-anchor="middle" fill="#B8441C">1</text>
    </g>
    <g transform="translate(965,110) rotate(6)">
      <rect x="-16" y="-14" width="32" height="26" rx="3" fill="#B8441C" fill-opacity="0.10" stroke="#B8441C" stroke-opacity="0.5" />
      <text x="0" y="5" text-anchor="middle" fill="#B8441C">2</text>
    </g>
    <g transform="translate(1030,70) rotate(-4)">
      <rect x="-16" y="-14" width="32" height="26" rx="3" fill="#B8441C" fill-opacity="0.10" stroke="#B8441C" stroke-opacity="0.5" />
      <text x="0" y="5" text-anchor="middle" fill="#B8441C">3</text>
    </g>
  </g>

  <text x="151" y="220" font-family="Georgia, serif" font-size="17" fill="#1A2420" fill-opacity="0.75" font-style="italic">
    Every answer traces back to its exact source.
  </text>
</svg>
